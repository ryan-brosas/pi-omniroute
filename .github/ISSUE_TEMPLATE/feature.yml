name: Feature request
description: Propose a new capability or a change that makes the extension better
title: "[Feature] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today (that a reasonable user would want)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Shape, scope, and rough contract. Ideas > shameless marketing copy.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else did you try, and why did it fall short?
  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor checklist
      options:
        - label: I'm willing to implement this (with support)
        - label: I searched existing issues / the README first
