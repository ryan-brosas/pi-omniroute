name: npm publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (empty = package.json version). Must not already exist on npm.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, pack, publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release (tag + tarball)
      id-token: write # npm trusted publishing (OIDC, registered via npm trust github)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0 (OIDC-capable npm)
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Version
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Fail early when the version already exists on npm
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "pi-omniroute@$v" version >/dev/null 2>&1; then
            echo "::error::pi-omniroute@$v is already published - run again with a new version input (or bump package.json)"
            exit 1
          fi
          echo "publishing pi-omniroute@$v"
      - name: Build tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Publish to npm
        run: npm publish ./dist/*.tgz --provenance --access public
      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists - skipping"
            exit 0
          fi
          ARGS=(--title "pi-omniroute v$VERSION" --generate-release-notes --latest)
          case "$VERSION" in *-*) ARGS=(--title "pi-omniroute v$VERSION" --generate-release-notes --prerelease);; esac
          gh release create "v$VERSION" ./dist/*.tgz "${ARGS[@]}"
