# Release notes categories — label-driven (see labels: breaking-change, enhancement, bug, dependencies, documentation)
changelog:
  exclude:
    labels:
      - release:skip
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: New Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Dependencies
      labels:
        - dependencies
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
